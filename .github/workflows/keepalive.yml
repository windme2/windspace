name: Keep Services Alive

on:
  schedule:
    # Run every 10 minutes to prevent Railway/Render free tier from sleeping
    # Free tier services typically sleep after 15-30 minutes of inactivity
    # 
    # Frequency options:
    # - '*/10 * * * *' = Every 10 minutes (Recommended for free tier) ✅
    # - '*/15 * * * *' = Every 15 minutes (Minimum for Railway/Render) ⚠️
    # - '*/5 * * * *'  = Every 5 minutes (Too frequent, may hit rate limits) ❌
    # - '0 */6 * * *'  = Every 6 hours (For Supabase only, not enough for Railway) ❌
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  API_URL: ${{ secrets.API_URL }}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Keep Backend Alive
        run: |
          echo "⏰ $(date -u '+%Y-%m-%d %H:%M:%S UTC'): Pinging backend API..."
          
          if [ -z "${{ env.API_URL }}" ]; then
            echo "⚠️  API_URL secret not set. Please configure it in repository secrets."
            echo "For now, workflow will exit gracefully."
            exit 0
          fi
          
          # Main keepalive endpoint (queries database)
          RESPONSE=$(curl -s -w "\n%{http_code}" "${{ env.API_URL }}/api/keepalive" || echo "Failed\n000")
          STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "Response (HTTP $STATUS):"
          echo "$BODY"
          
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend is alive and database is connected!"
          else
            echo "❌ Backend health check failed with HTTP $STATUS"
            exit 1
          fi

      - name: Test Articles Endpoint
        continue-on-error: true
        run: |
          echo "📚 Testing articles endpoint to ensure full API functionality..."
          
          if [ -z "${{ env.API_URL }}" ]; then
            echo "⚠️  Skipping (API_URL not configured)"
            exit 0
          fi
          
          RESPONSE=$(curl -s -w "\n%{http_code}" "${{ env.API_URL }}/api/articles?limit=1" || echo "Failed\n000")
          STATUS=$(echo "$RESPONSE" | tail -n1)
          
          if [ "$STATUS" = "200" ]; then
            echo "✅ Articles endpoint is working perfectly!"
          else
            echo "⚠️  Articles endpoint returned HTTP $STATUS (non-critical)"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## 🎯 Keep-Alive Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL**: ${{ env.API_URL || 'Not configured' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow**: Keep Services Alive (Every 10 minutes)" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "✅ Workflow completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*This workflow prevents free-tier services from sleeping by sending regular requests.*" >> $GITHUB_STEP_SUMMARY
